name: butchery-moderation-lab

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://butchery_api:${DB_APP_PASSWORD:-local_api_password}@db:5432/${POSTGRES_DB:-butchery_lab}
  APP_ENV: local
  CORS_ORIGINS: '["http://localhost:3000"]'
  CLASSIFIER_BACKEND: fake
  DB_CONNECT_TIMEOUT_SECONDS: 3
  COMMENTS_PAGE_SIZE_DEFAULT: ${COMMENTS_PAGE_SIZE_DEFAULT:-12}
  COMMENTS_PAGE_SIZE_MAX: ${COMMENTS_PAGE_SIZE_MAX:-50}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-butchery_lab}
      POSTGRES_USER: ${POSTGRES_USER:-butchery_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_migration_password}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
      target: base
    environment:
      <<: *backend-env
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-butchery_migrator}:${POSTGRES_PASSWORD:-local_migration_password}@db:5432/${POSTGRES_DB:-butchery_lab}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_api_password}
    command: ["sh", "-c", "alembic upgrade head && python -m app.db.provision"]
    depends_on:
      db: {condition: service_healthy}

  backend:
    build:
      context: ./backend
      target: base
    environment: *backend-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=6)"]
      interval: 10s
      timeout: 8s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-db:
    image: postgres:17-alpine
    profiles: ["test"]
    environment:
      POSTGRES_DB: butchery_test
      POSTGRES_USER: test_migrator
      POSTGRES_PASSWORD: local_test_password
    tmpfs: ["/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_migrator -d butchery_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-test:
    profiles: ["test"]
    build:
      context: ./backend
      target: test
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://test_migrator:local_test_password@test-db:5432/butchery_test
      TEST_API_DATABASE_URL: postgresql+psycopg://butchery_api:local_test_api_password@test-db:5432/butchery_test
    depends_on:
      test-db: {condition: service_healthy}

volumes:
  postgres_data:
